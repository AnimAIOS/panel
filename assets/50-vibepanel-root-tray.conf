<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Let root-owned GUI apps reach this user's session bus so their
       StatusNotifierItem tray icons can register with vibepanel's watcher.
       Needed together with scripts/run-as-root-with-tray.sh: dbus-broker
       otherwise denies connections from any UID other than the bus owner. -->
  <policy context="default">
    <allow user="root"/>
  </policy>

  <policy user="root">
    <allow send_destination="*"/>
  </policy>
</busconfig>
